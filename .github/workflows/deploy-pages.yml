name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Refresh earthquake data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The lock file was created on Windows. npm install lets the Linux
        # runner resolve its platform-specific optional packages as well.
        run: npm install --no-audit --no-fund

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
