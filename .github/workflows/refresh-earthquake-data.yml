name: Refresh earthquake data

on:
  schedule:
    # GitHub Actions uses UTC. :10 every three hours is also
    # 00:10, 03:10, ... 21:10 in Asia/Seoul (UTC+9).
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthquake-data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest data
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect public USGS earthquake data
        run: npm run data:collect

      - name: Verify saved data
        run: npm run data:verify

      - name: Save changed data
        run: |
          if git diff --quiet; then
            echo "No data changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh earthquake observations"
          git push
